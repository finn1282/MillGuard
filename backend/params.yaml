# Every value: value, unit, source, status (validated | assumed | derived)
economics:
  throughput_tph:      {value: 60,      unit: t FFB/h, source: "Published mill simulation (plan 3.2)", status: validated}
  presses:             {value: 4,       unit: count,   source: "Plan 3.1 (4 presses x 15 t/h)", status: validated}
  press_throughput_tph: {value: 15,     unit: t FFB/h, source: "Plan 3.1", status: validated}
  oer:                 {value: 0.1974,  unit: fraction, source: "MPOB Overview of the Malaysian Oil Palm Industry 2025", status: validated}
  cpo_price_rm_per_t:  {value: 4292.5,  unit: RM/t,    source: "MPOB 2025 average CPO price (spot ~RM4,420 on 5 Oct 2026)", status: validated}
  cpo_price_slider_min: {value: 3800,   unit: RM/t,    source: "Plan 3.2 slider range", status: assumed}
  cpo_price_slider_max: {value: 5000,   unit: RM/t,    source: "Plan 3.2 slider range", status: assumed}
  rm_per_mill_hour:    {value: 50844,   unit: RM/h,    source: "60 x 0.1974 x 4292.5 (plan quotes ~RM50,800)", status: derived}
  rm_per_press_hour:   {value: 12711,   unit: RM/h,    source: "rm_per_mill_hour / 4 (plan quotes ~RM12,700)", status: derived}
  unplanned_press_stop_h: {value: 4,    unit: h,       source: "Team assumption", status: assumed}
  unplanned_boiler_stop_h: {value: 8,   unit: h,       source: "Team assumption (boiler stop halts whole mill)", status: assumed}
  planned_repair_extra_lost_h: {value: 0, unit: h,     source: "Repair done inside weekly planned stop", status: assumed}
  repair_stop_h_press: {value: 2, unit: h, source: "Fix-now repair stops one press this long", status: assumed}
  repair_stop_h_boiler: {value: 0, unit: h, source: "Boiler fix-now is a no-stop intervention", status: assumed}
  unplanned_repair_multiplier: {value: 1.5, unit: x parts, source: "Run-to-failure causes collateral damage; repair costs 1.5x planned parts", status: assumed}
  lost_share:          {value: 0.30,    unit: fraction, source: "Share of delayed output truly lost; range 0.20-0.40; rest caught up", status: assumed}
  lost_share_low:      {value: 0.20,    unit: fraction, source: "Plan 3.2 range", status: assumed}
  lost_share_high:     {value: 0.40,    unit: fraction, source: "Plan 3.2 range", status: assumed}
  false_alarm_cost_rm: {value: 300,     unit: RM,      source: "Inspection cost per false alarm", status: assumed}
  miss_cost_mult:      {value: 1.0,     unit: x,       source: "Slider: multiplier on cost of a missed failure", status: assumed}
  criticality_boiler:  {value: 1.0,     unit: mill share, source: "Boiler stop = whole mill", status: derived}
  criticality_press:   {value: 0.25,    unit: mill share, source: "One press = 1/4 mill", status: derived}

repair_cost_rm:   # parts + labour per fault class (placeholders)
  worm_wear:      {value: 6000,  unit: RM, source: "Placeholder", status: assumed}
  bearing:        {value: 4500,  unit: RM, source: "Placeholder", status: assumed}
  gearbox_shaft:  {value: 9000,  unit: RM, source: "Placeholder", status: assumed}
  hydraulic_cone: {value: 3500,  unit: RM, source: "Placeholder", status: assumed}
  electrical:     {value: 2500,  unit: RM, source: "Placeholder", status: assumed}
  boiler_steam:   {value: 3000,  unit: RM, source: "No-stop intervention (feed-water dosing, blowdown); placeholder", status: assumed}
  boiler_water:   {value: 3000,  unit: RM, source: "No-stop intervention (water treatment); placeholder", status: assumed}
  unknown:        {value: 3000,  unit: RM, source: "Placeholder", status: assumed}

simulator:
  n_mills:        {value: 10,  unit: count,  source: "Plan 3.1", status: assumed}
  months:         {value: 12,  unit: count,  source: "Plan 3.1", status: assumed}
  step_h:         {value: 1,   unit: h,      source: "Plan 3.1 hourly data", status: assumed}
  life_mu_worm_wear: {value: 6.663, unit: ln(running h), source: "Ishak, Hotmauli, Prajadhiana, RCM for press machines, SENTI UGM 2024 (palm oil mill 2023 screw press failure records, lognormal fit, MTTF ~1,045 h); cross-checks: Yudistia et al. IJIEM 7(1) 2026 (PT SIR average damage time: worm 366 h, bearing 403 h, shaft 649 h); Ramadhana UMM 2026 (worm interval 1,217 h); Wahyuny UIN Suska 2021 (replacement: worm 2,035 h, bearing 1,493 h)", status: validated}
  life_sigma_worm_wear: {value: 0.76, unit: ln(running h), source: "Ishak, Hotmauli, Prajadhiana, RCM for press machines, SENTI UGM 2024 (palm oil mill 2023 screw press failure records, lognormal fit, MTTF ~1,045 h); cross-checks: Yudistia et al. IJIEM 7(1) 2026 (PT SIR average damage time: worm 366 h, bearing 403 h, shaft 649 h); Ramadhana UMM 2026 (worm interval 1,217 h); Wahyuny UIN Suska 2021 (replacement: worm 2,035 h, bearing 1,493 h)", status: validated}
  life_mu_bearing: {value: 6.327, unit: ln(running h), source: "Ishak, Hotmauli, Prajadhiana, RCM for press machines, SENTI UGM 2024 (palm oil mill 2023 screw press failure records, lognormal fit, MTTF ~622 h); cross-checks: Yudistia et al. IJIEM 7(1) 2026 (PT SIR average damage time: worm 366 h, bearing 403 h, shaft 649 h); Ramadhana UMM 2026 (worm interval 1,217 h); Wahyuny UIN Suska 2021 (replacement: worm 2,035 h, bearing 1,493 h)", status: validated}
  life_sigma_bearing: {value: 0.462, unit: ln(running h), source: "Ishak, Hotmauli, Prajadhiana, RCM for press machines, SENTI UGM 2024 (palm oil mill 2023 screw press failure records, lognormal fit, MTTF ~622 h); cross-checks: Yudistia et al. IJIEM 7(1) 2026 (PT SIR average damage time: worm 366 h, bearing 403 h, shaft 649 h); Ramadhana UMM 2026 (worm interval 1,217 h); Wahyuny UIN Suska 2021 (replacement: worm 2,035 h, bearing 1,493 h)", status: validated}
  life_mu_gearbox_shaft: {value: 6.405, unit: ln(running h), source: "Ishak, Hotmauli, Prajadhiana, RCM for press machines, SENTI UGM 2024 (palm oil mill 2023 screw press failure records, lognormal fit, MTTF ~825 h); cross-checks: Yudistia et al. IJIEM 7(1) 2026 (PT SIR average damage time: worm 366 h, bearing 403 h, shaft 649 h); Ramadhana UMM 2026 (worm interval 1,217 h); Wahyuny UIN Suska 2021 (replacement: worm 2,035 h, bearing 1,493 h)", status: validated}
  life_sigma_gearbox_shaft: {value: 0.787, unit: ln(running h), source: "Ishak, Hotmauli, Prajadhiana, RCM for press machines, SENTI UGM 2024 (palm oil mill 2023 screw press failure records, lognormal fit, MTTF ~825 h); cross-checks: Yudistia et al. IJIEM 7(1) 2026 (PT SIR average damage time: worm 366 h, bearing 403 h, shaft 649 h); Ramadhana UMM 2026 (worm interval 1,217 h); Wahyuny UIN Suska 2021 (replacement: worm 2,035 h, bearing 1,493 h)", status: validated}
  life_h_min_hydraulic_cone: {value: 5000, unit: running h, source: "No published figure for the cone hydraulics; kept from v1", status: assumed}
  life_h_max_hydraulic_cone: {value: 14000, unit: running h, source: "No published figure for the cone hydraulics; kept from v1", status: assumed}
  life_min_margin_h: {value: 50, unit: h, source: "Each life is clipped to at least its P-F warning period + this margin so a warning is always possible", status: assumed}
  cone_pressure_max_bar: {value: 60, unit: bar, source: "Plan 3.1 calibration anchor", status: validated}
  fibre_oil_loss_alarm:  {value: 0.04, unit: fraction, source: "Thai mill sensor study (SAJIE 36(1))", status: validated}
  target_stops_per_mill_year: {value: [80, 140], unit: count, source: "Lognormal lives give roughly 80-130 press stops per mill-year; consistent with the North Sumatra mill that logged 65 press breakdowns in 7 months (Aprilia et al., USU 2025)", status: validated}
  reference_breakdowns_7_months: {value: 65, unit: count, source: "Aprilia et al., USU 2025: North Sumatra mill, 65 press breakdowns in 7 months (sanity line only)", status: validated}
  messy_work_order_share: {value: 0.10, unit: fraction, source: "Plan 3.1 (wrong class or late timestamp)", status: assumed}
  weekly_planned_stop_h:  {value: 6,  unit: h, source: "Plan 2.3 (06:00 stop); duration assumed", status: assumed}
  missing_reading_rate:   {value: 0.01, unit: fraction, source: "Team assumption", status: assumed}
  # Monthly crop index, Jan..Dec = MPOB 2025 monthly CPO production (Nov revised, Dec preliminary) / annual mean.
  crop_index_2025:
    value: [0.734, 0.703, 0.821, 0.998, 1.048, 1.001, 1.072, 1.097, 1.089, 1.209, 1.145, 1.082]
    unit: relative to annual mean
    source: "MPOB 2025 monthly CPO production, normalised to the mean (plan v1.4 item 4); Dec is preliminary"
    status: validated
  # P-F interval: running hours from first detectable sign to failure (effect ramps 0 to 1 over this many hours)
  pf_h_worm_wear:      {value: 300, unit: running h, source: "Plan v1.4: worm wear shows several days to weeks ahead", status: assumed}
  pf_h_gearbox_shaft:  {value: 400, unit: running h, source: "Plan v1.4: gearbox shows several days to weeks ahead", status: assumed}
  pf_h_bearing:        {value: 150, unit: running h, source: "Plan v1.4: bearing shows several days ahead", status: assumed}
  pf_h_hydraulic_cone: {value: 200, unit: running h, source: "Plan v1.4 (assumed, between bearing and worm)", status: assumed}

alerting:
  persistence_h:   {value: 3,   unit: h,     source: "Plan 4.1", status: validated}
  max_per_shift:   {value: 5,   unit: count, source: "Plan 4.1", status: validated}
  horizon_h:       {value: 72,  unit: h,     source: "Plan 4.1", status: validated}
  hysteresis_ratio: {value: 0.6, unit: x threshold, source: "Clear below 60% of threshold", status: assumed}
  inspection_finds_wrong_class: {value: 0.5, unit: probability, source: "If the predicted class is wrong, the crew inspection still finds the real fault this often", status: assumed}
  fix_now_response_h: {value: 4, unit: h, source: "Time from fix-now alert to repair done", status: assumed}
  clear_hours:     {value: 6, unit: h, source: "Alert clears after this many hours below hysteresis level", status: assumed}
  min_lead_h:      {value: 6,   unit: h,     source: "Alert only if time remains to act", status: assumed}
  fixed_interval_h: {value: 1000, unit: h,   source: "Fixed-interval policy; near RCM worm interval ~1,217 h", status: assumed}
