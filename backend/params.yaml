  months:         {value: 12,  unit: count,  source: "Plan 3.1", status: assumed}
  step_h:         {value: 1,   unit: h,      source: "Plan 3.1 hourly data", status: assumed}
  worm_life_h_min: {value: 700,  unit: h, source: "Plan 1.4 (700-800 h in original plan)", status: validated}
  worm_life_h_max: {value: 2000, unit: h, source: "RCM screw press studies: ~1,217 h interval, ~2,035 h replacement (UMM 2026, UIN Suska 2021)", status: validated}
  cone_pressure_max_bar: {value: 60, unit: bar, source: "Plan 3.1 calibration anchor", status: validated}
  fibre_oil_loss_alarm:  {value: 0.04, unit: fraction, source: "Thai mill sensor study (SAJIE 36(1))", status: validated}
