  weekly_planned_stop_h:  {value: 6,  unit: h, source: "Plan 2.3 (06:00 stop); duration assumed", status: assumed}
  missing_reading_rate:   {value: 0.01, unit: fraction, source: "Team assumption", status: assumed}
  # Monthly crop index, Jan..Dec, mean=1. Plan anchors: Feb low ~1.19 Mt, Oct peak ~2.04 Mt (MPOB 2025). Other months interpolated: replace with MPOB monthly table.
  crop_index_2025:
    value: [0.84, 0.72, 0.82, 0.88, 0.97, 1.02, 1.08, 1.15, 1.19, 1.22, 1.12, 0.99]
    unit: relative to annual mean
    source: "MPOB monthly summary 2025; only Feb and Oct anchors from plan, rest approximate"
    status: assumed

alerting:
