  unplanned_boiler_stop_h: {value: 8,   unit: h,       source: "Team assumption (boiler stop halts whole mill)", status: assumed}
  planned_repair_extra_lost_h: {value: 0, unit: h,     source: "Repair done inside weekly planned stop", status: assumed}
  repair_stop_h_press: {value: 2, unit: h, source: "Fix-now repair stops one press this long", status: assumed}
  repair_stop_h_boiler: {value: 0, unit: h, source: "Boiler fix-now is a no-stop intervention", status: assumed}
  unplanned_repair_multiplier: {value: 1.5, unit: x parts, source: "Run-to-failure causes collateral damage; repair costs 1.5x planned parts", status: assumed}
  lost_share:          {value: 0.30,    unit: fraction, source: "Share of delayed output truly lost; range 0.20-0.40; rest caught up", status: assumed}
  lost_share_low:      {value: 0.20,    unit: fraction, source: "Plan 3.2 range", status: assumed}
  lost_share_high:     {value: 0.40,    unit: fraction, source: "Plan 3.2 range", status: assumed}
  false_alarm_cost_rm: {value: 300,     unit: RM,      source: "Inspection cost per false alarm", status: assumed}
  miss_cost_mult:      {value: 1.0,     unit: x,       source: "Slider: multiplier on cost of a missed failure", status: assumed}
  criticality_boiler:  {value: 1.0,     unit: mill share, source: "Boiler stop = whole mill", status: derived}
  criticality_press:   {value: 0.25,    unit: mill share, source: "One press = 1/4 mill", status: derived}

