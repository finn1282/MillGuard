  cpo_price_slider_max: {value: 5000,   unit: RM/t,    source: "Plan 3.2 slider range", status: assumed}
  rm_per_mill_hour:    {value: 50844,   unit: RM/h,    source: "60 x 0.1974 x 4292.5 (plan quotes ~RM50,800)", status: derived}
  rm_per_press_hour:   {value: 12711,   unit: RM/h,    source: "rm_per_mill_hour / 4 (plan quotes ~RM12,700)", status: derived}
